name: TidyShot

options:
  bundleIdPrefix: io.tky
  xcodeVersion: "27.1"
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

# The language mode, shared by the app and the tests so the two cannot drift apart.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

targets:
  TidyShot:
    type: application
    platform: macOS
    sources:
      - path: TidyShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tky.tidyshot
        PRODUCT_NAME: TidyShot
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Ad-hoc signing injects com.apple.security.get-task-allow, which would let a same-user
        # process attach to TidyShot and borrow its Screen Recording grant. Debug keeps it for
        # tests and the debugger.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: TidyShot/Info.plist
      properties:
        CFBundleName: TidyShot
        CFBundleDisplayName: TidyShot
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Tim Yocum"
        # Asking for microphone access without it ends the process.
        NSMicrophoneUsageDescription: TidyShot records your microphone in screen recordings when you turn it on.
        # Capture → Recording → Show webcam bubble (recording R3). Asking for camera access without
        # the usage string ends the process. Without the Continuity Camera key the iPhone reports
        # as a built-in camera, and reaction gestures stay off so a hand does not fire balloons
        # into a recording.
        NSCameraUsageDescription: TidyShot shows your camera in a bubble in screen recordings when you turn it on.
        NSCameraUseContinuityCameraDeviceType: true
        NSCameraReactionEffectGesturesEnabledDefault: false
        CFBundleURLTypes:
          - CFBundleURLName: io.tky.tidyshot
            CFBundleURLSchemes:
              - tidyshot
    entitlements:
      path: TidyShot/TidyShot.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        # Capture → Recording → Microphone (recording R2).
        com.apple.security.device.audio-input: true
        # Capture → Recording → Show webcam bubble (recording R3).
        com.apple.security.device.camera: true
        # Optimize images with Clop (spec 2.7): Clop's CFMessagePort, direct and Setapp builds.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.lowtechguys.Clop.optimisationService
          - com.lowtechguys.Clop-setapp.optimisationService
    dependencies:
      - package: KeyboardShortcuts
    scheme:
      testTargets:
        - TidyShotTests

  TidyShotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TidyShotTests
        excludes:
          - "Fixtures/**"
      - path: TidyShotTests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TidyShot
