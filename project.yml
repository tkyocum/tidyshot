name: TidyShot

options:
  bundleIdPrefix: io.tky
  xcodeVersion: "27.1"
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

targets:
  TidyShot:
    type: application
    platform: macOS
    sources:
      - path: TidyShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tky.tidyshot
        PRODUCT_NAME: TidyShot
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TidyShot/Info.plist
      properties:
        CFBundleName: TidyShot
        CFBundleDisplayName: TidyShot
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Tim Yocum"
    entitlements:
      path: TidyShot/TidyShot.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    dependencies:
      - package: KeyboardShortcuts
    scheme:
      testTargets:
        - TidyShotTests

  TidyShotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TidyShotTests
        excludes:
          - "Fixtures/**"
      - path: TidyShotTests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TidyShot
